name: Publish APK builder image
on:
  push:
    branches: [main]
    paths: [Dockerfile, requirements.txt, apk_builder/**, .github/workflows/publish-builder.yml]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/zelocare/zelocare-apk-builder:dev
